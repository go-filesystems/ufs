name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Native runners: full lint + build + test (race + coverage) via the
  # Taskfile, exactly as a developer runs it locally.
  native:
    name: native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout ufs
        uses: actions/checkout@v7
        with:
          path: ufs

      # go.mod carries `replace github.com/go-filesystems/interface =>
      # ../interface`, so the sibling module must sit next to this one.
      - name: Checkout interface (sibling replace target)
        uses: actions/checkout@v7
        with:
          repository: go-filesystems/interface
          path: interface

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: ufs/go.mod

      - name: Install Task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Taskfile ci
        working-directory: ufs
        run: task ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.arch }}
          path: ufs/cover.out
          if-no-files-found: ignore

  # Emulated runners: cross-compile a static (CGO_ENABLED=0) test binary
  # per package and run it under QEMU for each non-native 64-bit arch.
  # s390x is big-endian, which exercises the UFS byte-order handling: the
  # on-disk superblock / inode / indirect-block decoders all use explicit
  # binary.LittleEndian, so reads stay host-endianness-independent.
  emulated:
    name: emulated ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            qemu: rv64,v=true,vlen=128
          - arch: loong64
            image: ghcr.io/loong64/debian:trixie
            qemu: la464
          - arch: ppc64le
            image: debian:trixie
            qemu: power9
          - arch: s390x
            image: debian:trixie
            qemu: qemu
    steps:
      - name: Checkout ufs
        uses: actions/checkout@v7
        with:
          path: ufs

      - name: Checkout interface (sibling replace target)
        uses: actions/checkout@v7
        with:
          repository: go-filesystems/interface
          path: interface

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: ufs/go.mod

      - name: Register QEMU binfmt handlers
        run: docker run --rm --privileged tonistiigi/binfmt --install all

      - name: Cross-compile per-package test binaries
        working-directory: ufs
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p /tmp/tests
          for pkg in $(go list ./...); do
            name=$(echo "$pkg" | tr '/' '_')
            # Skip packages without test files (go test -c emits no binary).
            go test -c -cover -o "/tmp/tests/${name}.test" "$pkg"
            if [ -f "/tmp/tests/${name}.test" ]; then
              echo "built ${name}.test"
            fi
          done
          ls -la /tmp/tests

      - name: Run test binaries under QEMU (${{ matrix.arch }})
        env:
          QEMU_CPU: ${{ matrix.qemu }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=(/tmp/tests/*.test)
          if [ ${#bins[@]} -eq 0 ]; then
            echo "no test binaries to run"; exit 0
          fi
          # ⛔ Pull ONCE, before the loop, and retry.
          #
          # `docker run` pulls on demand, so the image was fetched inside the
          # loop -- once per test binary. A transient registry timeout on the
          # FIRST binary therefore fails the whole lane while the very next
          # pull succeeds and its tests pass. That took go-filesystems/xfs's
          # main red on 2026-09-24 with every test passing:
          #
          #   docker: Get "https://ghcr.io/v2/loong64/debian/manifests/...":
          #   dial tcp 140.82.112.34:443: i/o timeout
          #
          # The log ended in PASS followed by exit 1, which reads like a lost
          # exit status and is not one. Re-running with nothing changed turned
          # it green.
          #
          # Three attempts, because one attempt is a flake detector rather
          # than a fetch, and a lane that goes red at random is a lane people
          # learn to re-run without reading.
          for attempt in 1 2 3; do
            if docker pull --platform linux/${{ matrix.arch }} ${{ matrix.image }}; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::could not pull ${{ matrix.image }} after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done

          rc=0
          for bin in "${bins[@]}"; do
            echo "::group::$(basename "$bin")"
            if ! docker run --rm \
              --platform linux/${{ matrix.arch }} \
              -e QEMU_CPU="${QEMU_CPU}" \
              -v /tmp/tests:/t -w /t \
              ${{ matrix.image }} \
              "./$(basename "$bin")" -test.v; then
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc
